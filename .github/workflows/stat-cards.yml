name: Stat cards

# Regenerates the README stat cards into assets/ so they are served from this
# repository instead of a shared third-party instance that is often rate limited.
on:
  schedule:
    # 03:17 UTC daily; an off-the-hour minute avoids the scheduler's busiest slots.
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-stat-cards.mjs"
      - ".github/workflows/stat-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stat-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/generate-stat-cards.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          # Nothing to do when the numbers have not moved since the last run.
          if git diff --staged --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile stat cards"
          git push
