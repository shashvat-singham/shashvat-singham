<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contribution streak">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .label { font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .icon  { fill: #bf91f3; }
    .fade  { opacity: 0; animation: fadein 0.5s ease-in-out forwards; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { opacity: 1; animation: none; }
    }
  
    .streak-num   { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .streak-big   { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #bf91f3; }
    .streak-label { font: 700 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .streak-sub   { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; opacity: 0.75; }
  </style>
  <rect width="494" height="194" x="0.5" y="0.5" rx="6" fill="#1a1b27" stroke="#1a1b27"/>
  
    <g class="fade" transform="translate(82.5, 0)" style="animation-delay: 150ms">
      <text class="streak-num" x="0" y="72" text-anchor="middle">1.3k</text>
      <text class="streak-label" x="0" y="100" text-anchor="middle">Total Contributions</text>
      <text class="streak-sub" x="0" y="122" text-anchor="middle">All time</text>
    </g>
  <g class="fade" transform="translate(247.5, 0)" style="animation-delay: 270ms">
    <circle cx="0" cy="62" r="42" fill="none" stroke="#bf91f3" stroke-width="4"/>
    <text class="streak-big" x="0" y="72" text-anchor="middle">4</text>
    <text class="streak-label" x="0" y="128" text-anchor="middle">Current Streak</text>
    <text class="streak-sub" x="0" y="150" text-anchor="middle">15 Aug 2026 - 18 Aug 2026</text>
  </g>
  
    <g class="fade" transform="translate(412.5, 0)" style="animation-delay: 390ms">
      <text class="streak-num" x="0" y="72" text-anchor="middle">9</text>
      <text class="streak-label" x="0" y="100" text-anchor="middle">Longest Streak</text>
      <text class="streak-sub" x="0" y="122" text-anchor="middle">Days in a row</text>
    </g>
  <line x1="165" y1="42" x2="165" y2="152" stroke="#38bdae" stroke-opacity="0.2"/>
  <line x1="330" y1="42" x2="330" y2="152" stroke="#38bdae" stroke-opacity="0.2"/>
</svg>
